<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Report Officina — Autoservice Valente -->
  <rect width="512" height="512" rx="112" fill="#0B0B0D"/>

  <!-- Ingranaggio -->
  <g fill="#F5A623">
    <g>
      <rect x="226" y="100" width="60" height="60" rx="12"/>
      <rect x="226" y="100" width="60" height="60" rx="12" transform="rotate(45 256 256)"/>
      <rect x="226" y="100" width="60" height="60" rx="12" transform="rotate(90 256 256)"/>
